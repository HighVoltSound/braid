name: Feature request
description: A check braid should find, or something it should do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and where braid gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would solve it. For a new stack, the files that mark a project and the commands that check it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds tried
      description: For example a `checks` entry in `.claude/braid.json`.
